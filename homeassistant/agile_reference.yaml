# Reference-rate package: the live Octopus Flexible (price-capped SVT) unit
# rate for region H, fetched from the public API twice a day. This is "what
# you'd be paying if you hadn't switched" — the expensive-announcement
# threshold pegs to it, so cap changes each quarter track automatically.
rest:
  - resource: "https://api.octopus.energy/v1/products/VAR-22-11-01/electricity-tariffs/E-1R-VAR-22-11-01-H/standard-unit-rates/?page_size=10"
    scan_interval: 43200
    sensor:
      - name: "Flexible reference rate"
        unique_id: agile_flexible_reference_rate
        unit_of_measurement: "GBP/kWh"
        value_template: >-
          {{ (value_json.results
              | selectattr('payment_method', 'eq', 'DIRECT_DEBIT')
              | selectattr('valid_to', 'none')
              | map(attribute='value_inc_vat') | first | float(26.4)) / 100 }}
